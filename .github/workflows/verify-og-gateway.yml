name: Verify 0G gateway
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned official verifier
        uses: actions/checkout@v4
        with:
          repository: 0gfoundation/0g-pc-e2ee
          ref: a37a20cbbfd917197353950dd10cf62cc6c1e457
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build official verifier
        working-directory: client/cmd/pcverify
        run: go build -mod=readonly -o "$RUNNER_TEMP/pcverify" .
      - name: Verify gateway without credentials or inference
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification
          date -u +%FT%TZ > verification/checked-at.txt
          git rev-parse HEAD > verification/verifier-commit.txt
          # A pass covers the observed gateway connection, not future requests.
          "$RUNNER_TEMP/pcverify" -gateway router-api.0g.ai -strict 2>&1 | tee verification/gateway.txt
      - name: Preserve verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: og-gateway-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 14
